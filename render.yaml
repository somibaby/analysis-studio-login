# Render Blueprint for the Python analysis server.
# Render → New → Blueprint → pick this repository. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: analysis-studio-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_FROM
        value: Analysis Studio <onboarding@resend.dev>
      - key: CRON_SECRET
        generateValue: true
